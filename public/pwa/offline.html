<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#056DE8">
<title>离线 · DudaCMS</title>
<script>
/* 离线页自包含：读取主题偏好，避免离线时依赖外部脚本 */
(function (w, d) {
  var pref = null; try { pref = w.localStorage.getItem('dask_theme'); } catch (e) {}
  if (['light','dark','auto'].indexOf(pref) === -1) {
    var m = d.cookie.match(/(?:^|; )dask_theme=([^;]*)/);
    pref = m ? decodeURIComponent(m[1]) : 'auto';
  }
  if (['light','dark','auto'].indexOf(pref) === -1) pref = 'auto';
  var media = w.matchMedia ? w.matchMedia('(prefers-color-scheme: dark)') : null;
  var dark = pref === 'dark' || (pref === 'auto' && media && media.matches);
  d.documentElement.setAttribute('data-theme', pref);
  d.documentElement.setAttribute('data-dark', dark ? '1' : '0');
})(window, document);
</script>
<style>
:root { --primary:#056DE8; --text:#121212; --muted:#646B78; --line:#E5E5E5; --bg:#F6F6F6; --surface:#FFFFFF; --shadow:0 8px 28px rgba(18,18,18,.10); }
html[data-dark="1"], html[data-theme="dark"] { --primary:#6FB0FF; --text:#E8EAED; --muted:#A8ADB7; --line:#30343C; --bg:#14161A; --surface:#1E2127; --shadow:0 8px 28px rgba(0,0,0,.45); }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
.offline-page { min-height:100vh; display:grid; place-items:center; padding:24px; }
.offline-card { width:100%; max-width:380px; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:32px 24px; box-shadow:var(--shadow); }
.offline-icon { width:64px; height:64px; margin:0 auto 16px; border-radius:18px; display:grid; place-items:center; background:var(--primary); color:#fff; font-size:30px; font-weight:800; }
.offline-card h1 { margin:0 0 8px; font-size:22px; }
.offline-card p { color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 20px; }
.btn { display:flex; align-items:center; justify-content:center; min-height:42px; margin-top:10px; border-radius:10px; font-size:14px; border:1px solid transparent; cursor:pointer; text-decoration:none; }
.btn-primary { background:var(--primary); border-color:var(--primary); color:#fff; }
.btn-ghost { background:transparent; border-color:var(--line); color:var(--text); }
</style>
</head>
<body class="offline-page">
<main class="offline-card">
    <div class="offline-icon">逼</div>
    <h1>暂时离线</h1>
    <p>网络恢复后即可继续浏览。已缓存的页面仍可访问。</p>
    <button class="btn btn-primary" onclick="location.reload()">重新加载</button>
    <a class="btn btn-ghost" href="/">返回首页</a>
</main>
</body>
</html>
