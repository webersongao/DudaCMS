<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 112" role="img" aria-label="逼乎 - 装逼版的知乎">
  <defs>
    <linearGradient id="bWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A7BEE"/>
      <stop offset="1" stop-color="#03449E"/>
    </linearGradient>
    <linearGradient id="bWingLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA8FF"/>
      <stop offset="1" stop-color="#0A7BEE"/>
    </linearGradient>
    <linearGradient id="bRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#056DE8"/>
      <stop offset="1" stop-color="#023C8E"/>
    </linearGradient>
  </defs>

  <!-- ===== 左侧：宾利风徽章 ===== -->
  <g transform="translate(2 6)">
    <!-- 顶部拱形（翅膀上缘） -->
    <path d="M32 40 C40 16 96 16 104 40 L96 40 C90 24 46 24 40 40 Z" fill="url(#bWing)"/>
    <!-- 左右翅膀横纹：深浅交替，向外收窄 -->
    <path d="M8 46 H112 L104 54 H16 Z" fill="url(#bWing)"/>
    <path d="M14 57 H106 L98 65 H22 Z" fill="url(#bWingLight)"/>
    <path d="M22 68 H98 L88 76 H32 Z" fill="url(#bWing)"/>
    <path d="M32 79 H88 L76 87 H44 Z" fill="url(#bWingLight)"/>
    <!-- 底部托弧 -->
    <path d="M44 88 C52 100 68 100 76 88 L68 86 C64 92 56 92 52 86 Z" fill="url(#bWing)"/>
    <!-- 中央圆环 -->
    <circle cx="60" cy="51" r="27" fill="#FFFFFF"/>
    <circle cx="60" cy="51" r="27" fill="none" stroke="url(#bRing)" stroke-width="3"/>
    <!-- 圆环内的 B：加粗衬线，致敬车标的沉稳感 -->
    <text x="60" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#bRing)">B</text>
  </g>

  <!-- ===== 右侧：书法感「逼乎」 ===== -->
  <g fill="#056DE8" stroke="#056DE8" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke fill"
     font-family="'STXingkai','Xingkai SC','STKaiti','KaiTi','Kaiti SC','楷体',cursive" font-weight="700">
    <text x="150" y="84" font-size="78" letter-spacing="6">逼乎</text>
  </g>
</svg>
